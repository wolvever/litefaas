id: node-nestjs-prisma
title: NestJS + Prisma
language: node
runtime: node
kind: backend
memory: 256
priority: 85
description: NestJS HTTP API with Prisma. Priority above express-prisma (80), below nextjs (90).

match:
  - files: [package.json, prisma/schema.prisma]
    contains:
      - file: package.json
        any: ["@nestjs/core"]
      - file: package.json
        any: ["@prisma/client", prisma]
  - files: [package.json]
    contains:
      - file: package.json
        any: ["@nestjs/core"]
      - file: package.json
        any: ["@prisma/client", prisma]

hints:
  sidecars: [postgres, redis]
  env:
    DATABASE_URL: postgres://app:app@localhost:5432/app
    REDIS_URL: redis://localhost:6379/0

host:
  build: ["npm", "run", "build"]

verify:
  health: /healthz
