id: go-echo-gorm
title: Echo + GORM
language: go
runtime: go
kind: backend
memory: 128
priority: 75
description: Go HTTP API with Echo and GORM. Bind 0.0.0.0:$PORT. Priority below gin-gorm (80).

match:
  - files: [go.mod]
    contains:
      - file: go.mod
        any: [github.com/labstack/echo]
      - file: go.mod
        any: [gorm.io/gorm, github.com/jinzhu/gorm]

hints:
  sidecars: [postgres]
  env:
    DATABASE_URL: postgres://app:app@localhost:5432/app
