server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:library;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
